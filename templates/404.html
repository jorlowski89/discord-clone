{% extends "base.html" %}
{% load static %}

{% block title %}404 | PyCord{% endblock %}

{% block content %}
<section class="not-found-shell">
    <div class="not-found-copy text-center">
        <span class="badge text-bg-info text-dark mb-3">404</span>
        <h1 class="h2 fw-bold mb-2">Strona nie zostala znaleziona</h1>
    </div>
    <div class="not-found-art">
        <img src="{% static 'img/page-not-found.png' %}" alt="Zagubiona wiadomosc szuka brakujacej strony">
    </div>
    <div class="not-found-actions">
        <a href="{% url 'home' %}" class="btn btn-info btn-lg text-dark">Strona glowna</a>
    </div>
</section>
{% endblock %}
